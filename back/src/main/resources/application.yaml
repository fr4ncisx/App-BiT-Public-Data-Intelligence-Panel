spring:
  application:
    name: geo-analytics-api
  profiles:
    default: dev
  ai:
    google:
      genai:
        api-key: ${SPRING_AI_GOOGLE_GENAI_API_KEY}
        chat:
          model: ${SPRING_AI_GOOGLE_GENAI_CHAT_MODEL:gemini-3.1-flash-lite}
          thinking-level: ${SPRING_AI_GOOGLE_GENAI_CHAT_THINKING_LEVEL:LOW}
          temperature: 0.3
          max-output-tokens: 500
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  web:
    error:
      include-stacktrace: never
      include-message: never
      include-exception: false
      include-binding-errors: never
  jackson:
    factory:
      constraints:
        read:
          max-string-length: 10000
          max-number-length: 1000
          max-nesting-depth: 100
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health, prometheus, metrics
  endpoint:
    health:
      show-details: never
  prometheus:
    metrics:
      export:
        enabled: true

appbit:
  api:
    cors:
      allowed-origins: ${APPBIT_API_CORS_ALLOWED_ORIGINS}
  ingestion:
    enabled: ${APPBIT_INGESTION_ENABLED:true}
    batch-size: ${APPBIT_INGESTION_BATCH_SIZE:500}
    fail-fast: ${APPBIT_INGESTION_FAIL_FAST:true}
    skip-files: ${APPBIT_INGESTION_SKIP_FILES:tensor_mobilidade.csv,tensor_sequencias.csv,network_indicators_seed.csv,trajetos_comuns.csv,assinantes.csv,sumario_kanon.csv}
    retry:
      max-attempts: ${APPBIT_INGESTION_RETRY_MAX_ATTEMPTS:3}
      base-delay-ms: ${APPBIT_INGESTION_RETRY_BASE_DELAY_MS:2000}
  storage:
    r2:
      endpoint: ${APPBIT_STORAGE_R2_ENDPOINT}
      access-key-id: ${APPBIT_STORAGE_R2_ACCESS_KEY_ID}
      secret-access-key: ${APPBIT_STORAGE_R2_SECRET_ACCESS_KEY}
      bucket-name: ${APPBIT_STORAGE_R2_BUCKET_NAME}
      region: ${APPBIT_STORAGE_R2_REGION:auto}
      csv-prefix: ${APPBIT_STORAGE_R2_CSV_PREFIX:raw/visent-cdrview}

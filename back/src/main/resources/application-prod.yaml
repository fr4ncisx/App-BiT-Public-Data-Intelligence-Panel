spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 600000
      leak-detection-threshold: 10000
  jpa:
    properties:
      hibernate:
        jdbc:
          batch_size: 25
          fetch_size: 50
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 25
  lifecycle:
    timeout-per-shutdown-phase: 30s
  ai:
    google:
      genai:
        chat:
          model: gemini-3.5-flash
          thinking-level: MEDIUM
          max-output-tokens: 2048

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  structured:
    format:
      console: logstash

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
